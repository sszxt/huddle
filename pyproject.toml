[project]
name = "huddle"
version = "0.2.0"
description = "Run LLMs across a cluster of Linux machines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "llama.cpp", "gguf", "inference", "cluster", "vulkan", "openai-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "zeroconf>=0.151.3",
    "rich>=13.7",
    "huggingface_hub>=1.0,<2.0",
]

[project.urls]
Repository = "https://github.com/sszxt/huddle"
Issues = "https://github.com/sszxt/huddle/issues"
Changelog = "https://github.com/sszxt/huddle/blob/main/CHANGELOG.md"

[project.scripts]
huddle = "huddle.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huddle"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
