<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Huddle — Models</title>
<style>
  :root { color-scheme: dark; }
  body {
    background: #000; color: #33ff33; font-family: ui-monospace, Menlo, Consolas, monospace;
    max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5;
  }
  h1 { text-align: center; letter-spacing: 0.3em; font-weight: bold; }
  h2 { color: #33ff33; border-bottom: 1px solid #1f7a1f; padding-bottom: 0.25rem; }
  section { border: 1px solid #1f7a1f; padding: 1rem; margin-bottom: 1.5rem; border-radius: 4px; }
  ul { list-style: none; padding: 0; }
  li { padding: 0.25rem 0; }
  .dim { color: #1f7a1f; }
  .loaded { color: #ffcc00; font-weight: bold; }
  .err { color: #ff4444; }
  input, button {
    background: #001a05; color: #33ff33; border: 1px solid #1f7a1f; padding: 0.4rem 0.6rem;
    font-family: inherit; border-radius: 3px;
  }
  button { cursor: pointer; }
  button:hover { background: #002a08; }
  input { width: 55%; }
  .row { display: flex; gap: 0.5rem; margin: 0.5rem 0; align-items: center; }
  .file-row { display: flex; justify-content: space-between; align-items: center; padding: 0.2rem 0; }
  progress { width: 100%; height: 1.2rem; accent-color: #33ff33; background: #001a05; }
  #search-results, #repo-files { margin-top: 0.75rem; }
</style>
</head>
<body>
  <h1>HUDDLE</h1>
  <p class="dim" style="text-align:center">model manager</p>

  <section>
    <h2>On disk</h2>
    <ul id="model-list"><li class="dim">loading…</li></ul>
  </section>

  <section>
    <h2>Download a model</h2>
    <div class="row">
      <input id="search-box" placeholder="search Hugging Face, e.g. qwen2.5 32b instruct" />
      <button id="search-btn">Search</button>
    </div>
    <div id="search-results"></div>
    <div id="repo-files"></div>
    <div id="download-progress"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
